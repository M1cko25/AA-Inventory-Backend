type Product {
    id: ID!
    name: String!
    sku: String!
    category: Category!
    price: Float!
    quantity: Int!
    supplier: Supplier!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Category {
    id: ID!
    name: String!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Supplier {
    id: ID!
    name: String!
    createdAt: DateTime!
    updatedAt: DateTime!
}